name: Scrape events and deploy site

on:
  schedule:
    # Daily at 10:00 UTC (5am EST / 6am EDT), so "today"/"this weekend" pages are fresh each morning
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Unit + acceptance tests (tests/test_acceptance.py has one test per site bug found so far).
      # A failure stops the job before anything is scraped, committed or deployed, so the live
      # site keeps the last good build. Runs before the HTML export because rendering in the
      # tests rewrites deferred_days.html.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Cache venue scrapers
        uses: actions/cache@v4
        with:
          path: .cache/venues
          key: venue-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            venue-cache-${{ runner.os }}-

      - run: python server.py export events.json
      - run: python server.py export html index.html
      - run: cp index.html events.html

      - name: Commit data and static site if changed
        run: |
          # Guard against corrupted or zero-byte data files
          if [ ! -s events.json ] || [ $(wc -c < events.json) -lt 100000 ]; then
            echo "ERROR: Corrupt or zero-byte events.json detected ($(wc -c < events.json 2>/dev/null || echo 0) bytes). Aborting commit to prevent data loss."
            exit 1
          fi
          if [ ! -s index.html ] || [ $(wc -c < index.html) -lt 100000 ]; then
            echo "ERROR: Corrupt or zero-byte index.html detected. Aborting."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json index.html events.html feed.xml events.ics *.txt robots.txt sitemap.xml og-*.jpg partiful_sources.json boston/ cambridge/ somerville/ music/ comedy/ free/ free-events-boston-this-weekend/ cambridge-events-tonight/ live-music-somerville/ board-game-nights-boston/ kids-family-events-boston/ boston-edm/ boston-events-today/ boston-events-this-weekend/ community_events.json highlights.json luckyseat_shows.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update events and site: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3; do
              git push && break
              echo "git push attempt $i failed; waiting before retry..."
              sleep $((i * 5))
              git fetch origin main
              git merge origin/main -X ours --no-edit || true
            done
          fi

      - name: Ping Search Engines (IndexNow)
        continue-on-error: true
        run: python scripts/ping_indexnow.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: scrape
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Process Community Event Submission

on:
  repository_dispatch:
    types: [community-event]
  workflow_dispatch:
    inputs:
      event_json:
        description: "Event JSON payload"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  add_event:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Add event from repository_dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python scripts/add_community_event.py "$EVENT_PAYLOAD"

      - name: Add event from workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          EVENT_PAYLOAD: ${{ github.event.inputs.event_json }}
        run: |
          python scripts/add_community_event.py "$EVENT_PAYLOAD"

      - name: Commit updated community events and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community_events.json events.json index.html events.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Add community event: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: add_event
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Pull Request CI Tests

# Runs the full suite on every PR into main. scrape.yml runs the same suite
# before each scheduled scrape; this catches breakage before merge instead.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run unit & acceptance tests
        run: python -m unittest discover -s tests -v

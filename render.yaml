services:
  - type: web
    name: boston-events
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

name = "boston-events-submissions"
main = "worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   GITHUB_TOKEN          fine-grained PAT with Actions: write on BehlV10/boston_events
#   GEMINI_API_KEY        Gemini API key from aistudio.google.com/apikey; enables POST /extract-flyer
#   TURNSTILE_SECRET_KEY  optional Cloudflare Turnstile check
#   ADMIN_TOKEN           long random string; enables GET /admin/flyer-usage (audit log)
#   AUDIT_SALT            optional random string mixed into hashed IPs in the audit log

[vars]
GITHUB_REPO = "BehlV10/boston_events"
ALLOWED_ORIGINS = "https://www.wickedbostonevents.com,https://wickedbostonevents.com,https://behlv10.github.io"
FLYER_DAILY_LIMIT_PER_IP = "15"
FLYER_DAILY_LIMIT_TOTAL = "400"
# Stop reading flyers for the day once the worker's tally of what the calls would cost at paid
# Gemini rates reaches this (the free tier itself costs nothing).
FLYER_DAILY_BUDGET_USD = "1"
# Model for flyer reading; any Gemini model with image input works.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Per-IP burst limit for /extract-flyer: 3 flyers a minute (approximate, per Cloudflare location).
[[ratelimits]]
name = "FLYER_RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 3
  period = 60

# Upvote counts (existing) and flyer rate limits. Create once with
# `npx wrangler kv namespace create UPVOTES` (and FLYER_LIMITS), then paste the ids here.
[[kv_namespaces]]
binding = "UPVOTES"
id = "ba6778566aa4471eadf0d1c0ea8816f4"

[[kv_namespaces]]
binding = "FLYER_LIMITS"
id = "b207bcfbca814be295be17ec0de9ff61"
